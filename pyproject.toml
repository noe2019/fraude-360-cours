[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraude360"
version = "1.0.0"
description = "Detection de la fraude transactionnelle - prototype de bout en bout"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Noe Careme Fouotsa"}]

dependencies = [
    "pandas>=2.1,<3", "numpy>=1.26,<3", "scipy>=1.11", "scikit-learn>=1.6",
    "pyarrow>=14", "mlflow>=2.16", "PyYAML>=6.0", "matplotlib>=3.8",
]

[project.optional-dependencies]
spark = ["pyspark==3.5.3", "delta-spark==3.2.1"]
service = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5", "requests>=2.31"]
dev = ["pytest>=8.0", "build>=1.0"]

[project.scripts]
fraude360 = "fraude360.pipeline:principal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
